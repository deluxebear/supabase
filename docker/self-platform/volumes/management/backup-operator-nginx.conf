worker_processes 1;
pid /tmp/nginx.pid;

events {
  worker_connections 256;
}

http {
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  resolver 127.0.0.11 ipv6=off valid=10s;

  server {
    listen 8443 ssl;
    server_name backup-operator-tls;
    client_max_body_size 1m;

    ssl_protocols TLSv1.3;
    ssl_certificate /run/secrets/fleet-management/server.crt;
    ssl_certificate_key /run/secrets/fleet-management/server.key;

    location / {
      set $backup_operator_upstream http://backup-operator:8080;
      proxy_pass $backup_operator_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_buffering off;
      proxy_read_timeout 60s;
    }
  }
}
