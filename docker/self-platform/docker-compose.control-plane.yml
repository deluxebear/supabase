name: supabase-fleet-control

# Production Fleet control plane. This project is intentionally separate from
# docker-compose.yml (the managed Supabase stack) and owns independent volumes.
# Never merge these volumes into a managed stack or its backup/restore policy.
services:
  platform-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PLATFORM_POSTGRES_PASSWORD:?set PLATFORM_POSTGRES_PASSWORD}
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d platform]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - platform-db-data:/var/lib/postgresql/data
    networks: [control]

  control-db-init:
    image: postgres:17
    restart: "no"
    depends_on:
      platform-db:
        condition: service_healthy
    environment:
      PGHOST: platform-db
      PGPORT: 5432
      PGDATABASE: postgres
      PGUSER: postgres
      PGPASSWORD: ${PLATFORM_POSTGRES_PASSWORD:?set PLATFORM_POSTGRES_PASSWORD}
      FLEET_CONTROL_POSTGRES_PASSWORD: ${FLEET_CONTROL_POSTGRES_PASSWORD:?set FLEET_CONTROL_POSTGRES_PASSWORD}
      BACKUP_OPERATOR_POSTGRES_PASSWORD: ${BACKUP_OPERATOR_POSTGRES_PASSWORD:?set BACKUP_OPERATOR_POSTGRES_PASSWORD}
    volumes:
      - ./scripts/init-control-databases.sh:/usr/local/bin/init-control-databases:ro
    entrypoint: [/bin/bash, /usr/local/bin/init-control-databases]
    networks: [control]

  platform-migrate:
    image: postgres:17
    restart: "no"
    depends_on:
      control-db-init:
        condition: service_completed_successfully
    environment:
      PGHOST: platform-db
      PGPORT: 5432
      PGDATABASE: platform
      PGUSER: postgres
      PGPASSWORD: ${PLATFORM_POSTGRES_PASSWORD:?set PLATFORM_POSTGRES_PASSWORD}
      PLATFORM_OUTBOX_DISPATCHER_PASSWORD: ${PLATFORM_OUTBOX_DISPATCHER_PASSWORD:?set PLATFORM_OUTBOX_DISPATCHER_PASSWORD}
    volumes:
      - ../volumes/platform/migrations:/platform-migrations:ro
      - ./scripts/run-platform-migrations.sh:/usr/local/bin/run-platform-migrations:ro
      - ./scripts/check-platform-migration-names.sh:/usr/local/bin/check-platform-migration-names.sh:ro
    entrypoint: [/bin/bash, /usr/local/bin/run-platform-migrations]
    command: [migrate]
    networks: [control]

  fleet-artifacts-init:
    image: alpine:3.21
    restart: "no"
    user: "0:0"
    command: [sh, -c, "chown -R 65532:65532 /var/lib/fleet-artifacts && chmod 0750 /var/lib/fleet-artifacts"]
    volumes:
      - fleet-artifacts:/var/lib/fleet-artifacts
    security_opt: [no-new-privileges:true]
    networks: [control]

  fleet-control:
    image: ${FLEET_CONTROL_IMAGE:?set FLEET_CONTROL_IMAGE}
    command: [--listen=0.0.0.0:8090, --enrollment-listen=0.0.0.0:8091, --agent-listen=0.0.0.0:8092]
    restart: unless-stopped
    read_only: true
    user: "65532:65532"
    depends_on:
      control-db-init:
        condition: service_completed_successfully
      fleet-artifacts-init:
        condition: service_completed_successfully
    environment:
      FLEET_CONTROL_SERVICE_ASSERTION_KEY: ${FLEET_CONTROL_SERVICE_ASSERTION_KEY:?set FLEET_CONTROL_SERVICE_ASSERTION_KEY}
      FLEET_CONTROL_SERVICE_ASSERTION_ISSUER: ${FLEET_CONTROL_SERVICE_ASSERTION_ISSUER:-studio-platform}
      FLEET_CONTROL_SERVICE_ASSERTION_AUDIENCE: ${FLEET_CONTROL_SERVICE_ASSERTION_AUDIENCE:-fleet-control}
      FLEET_CONTROL_STORE_DRIVER: postgres
      FLEET_CONTROL_STORE_DSN: postgres://fleet_control:${FLEET_CONTROL_POSTGRES_PASSWORD}@platform-db:5432/fleet_control?sslmode=disable
      FLEET_CONTROL_STORE_SYSTEM_IDENTIFIER: ${FLEET_CONTROL_STORE_SYSTEM_IDENTIFIER:-control-plane-postgres}
      FLEET_CONTROL_STORE_DATA_DOMAIN: ${FLEET_CONTROL_STORE_DATA_DOMAIN:-platform-db-data}
      FLEET_CONTROL_ARTIFACT_ROOT: /var/lib/fleet-artifacts
      FLEET_CONTROL_AGENT_CA_CERT: /run/secrets/fleet-management/ca.crt
      FLEET_CONTROL_AGENT_CA_KEY: /run/secrets/fleet-management/ca.key
      FLEET_CONTROL_AGENT_TRUST_DOMAIN: ${FLEET_CONTROL_AGENT_TRUST_DOMAIN:-fleet.internal}
      FLEET_CONTROL_AGENT_CERTIFICATE_TTL: ${FLEET_CONTROL_AGENT_CERTIFICATE_TTL:-1h}
      FLEET_CONTROL_AGENT_LEASE_TTL: ${FLEET_CONTROL_AGENT_LEASE_TTL:-30s}
      FLEET_CONTROL_AGENT_STALE_GRACE: ${FLEET_CONTROL_AGENT_STALE_GRACE:-30s}
      FLEET_CONTROL_ENROLLMENT_TOKEN_TTL: ${FLEET_CONTROL_ENROLLMENT_TOKEN_TTL:-10m}
      FLEET_CONTROL_CERTIFICATE_OVERLAP: ${FLEET_CONTROL_CERTIFICATE_OVERLAP:-5m}
      FLEET_CONTROL_MAX_AGENT_SESSIONS: ${FLEET_CONTROL_MAX_AGENT_SESSIONS:-300}
      FLEET_CONTROL_MAX_CONCURRENT_OPERATIONS: ${FLEET_CONTROL_MAX_CONCURRENT_OPERATIONS:-20}
      FLEET_CONTROL_MAX_CONCURRENT_OPERATIONS_PER_TARGET: ${FLEET_CONTROL_MAX_CONCURRENT_OPERATIONS_PER_TARGET:-2}
      FLEET_CONTROL_MAX_QUEUED_PER_ORGANIZATION: ${FLEET_CONTROL_MAX_QUEUED_PER_ORGANIZATION:-1000}
      FLEET_CONTROL_MAX_QUEUED_PER_TARGET: ${FLEET_CONTROL_MAX_QUEUED_PER_TARGET:-100}
      FLEET_CONTROL_MAX_ARTIFACT_BYTES_PER_PROJECT: ${FLEET_CONTROL_MAX_ARTIFACT_BYTES_PER_PROJECT:-1073741824}
      FLEET_CONTROL_MAX_ARTIFACT_BYTES_PER_ORGANIZATION: ${FLEET_CONTROL_MAX_ARTIFACT_BYTES_PER_ORGANIZATION:-21474836480}
      FLEET_CONTROL_MAX_EVENTS_PER_OPERATION: ${FLEET_CONTROL_MAX_EVENTS_PER_OPERATION:-10000}
      FLEET_CONTROL_RETENTION_INTERVAL: ${FLEET_CONTROL_RETENTION_INTERVAL:-5m}
      FLEET_CONTROL_TERMINAL_EVENT_RETENTION: ${FLEET_CONTROL_TERMINAL_EVENT_RETENTION:-720h}
      FLEET_CONTROL_AUDIT_RETENTION: ${FLEET_CONTROL_AUDIT_RETENTION:-8760h}
      FLEET_CONTROL_RETENTION_BATCH_SIZE: ${FLEET_CONTROL_RETENTION_BATCH_SIZE:-10000}
      FLEET_CONTROL_ENROLLMENT_SERVER_CERT: /run/secrets/fleet-management/server.crt
      FLEET_CONTROL_ENROLLMENT_SERVER_KEY: /run/secrets/fleet-management/server.key
    ports:
      - 127.0.0.1:${FLEET_CONTROL_HTTP_PORT:-8090}:8090
      - 127.0.0.1:${FLEET_CONTROL_ENROLLMENT_HTTPS_PORT:-8091}:8091
      - 127.0.0.1:${FLEET_CONTROL_AGENT_GRPC_PORT:-8092}:8092
    volumes:
      - fleet-artifacts:/var/lib/fleet-artifacts
    secrets:
      - source: fleet_agent_ca_cert
        target: fleet-management/ca.crt
      - source: fleet_agent_ca_key
        target: fleet-management/ca.key
      - source: fleet_enrollment_server_cert
        target: fleet-management/server.crt
      - source: fleet_enrollment_server_key
        target: fleet-management/server.key
    security_opt: [no-new-privileges:true]
    networks:
      control: {}
      management:
        aliases: [fleet-control]

  platform-outbox-dispatcher:
    image: ${FLEET_CONTROL_IMAGE:?set FLEET_CONTROL_IMAGE}
    command: [--mode=outbox-dispatcher]
    restart: unless-stopped
    read_only: true
    user: "65532:65532"
    depends_on:
      platform-migrate:
        condition: service_completed_successfully
      fleet-control:
        condition: service_started
    environment:
      PGHOST: platform-db
      PGPORT: 5432
      PGDATABASE: platform
      PGUSER: fleet_platform_dispatcher
      PGPASSWORD: ${PLATFORM_OUTBOX_DISPATCHER_PASSWORD:?set PLATFORM_OUTBOX_DISPATCHER_PASSWORD}
      PGSSLMODE: disable
      FLEET_CONTROL_URL: http://fleet-control:8090
      FLEET_CONTROL_SERVICE_ASSERTION_KEY: ${FLEET_CONTROL_SERVICE_ASSERTION_KEY:?set FLEET_CONTROL_SERVICE_ASSERTION_KEY}
      FLEET_CONTROL_SERVICE_ASSERTION_ISSUER: ${FLEET_CONTROL_SERVICE_ASSERTION_ISSUER:-studio-platform}
      FLEET_CONTROL_SERVICE_ASSERTION_AUDIENCE: ${FLEET_CONTROL_SERVICE_ASSERTION_AUDIENCE:-fleet-control}
      FLEET_OUTBOX_WORKER_ID: ${FLEET_OUTBOX_WORKER_ID:-fleet-outbox-1}
      FLEET_OUTBOX_LEASE: ${FLEET_OUTBOX_LEASE:-30s}
      FLEET_OUTBOX_POLL_INTERVAL: ${FLEET_OUTBOX_POLL_INTERVAL:-2s}
    security_opt: [no-new-privileges:true]
    networks: [control]

  backup-operator:
    image: ${BACKUP_OPERATOR_IMAGE:?set BACKUP_OPERATOR_IMAGE}
    command: [--mode=operator, --listen=0.0.0.0:8080]
    restart: unless-stopped
    read_only: true
    user: "65532:65532"
    depends_on:
      control-db-init:
        condition: service_completed_successfully
    environment:
      # One management-target signing key is shared by its registered domain
      # APIs; audience pinning still prevents cross-domain assertion reuse.
      BACKUP_OPERATOR_SERVICE_ASSERTION_KEY: ${FLEET_CONTROL_SERVICE_ASSERTION_KEY:?set FLEET_CONTROL_SERVICE_ASSERTION_KEY}
      BACKUP_OPERATOR_SERVICE_ASSERTION_ISSUER: ${BACKUP_OPERATOR_SERVICE_ASSERTION_ISSUER:-studio-platform}
      BACKUP_OPERATOR_SERVICE_ASSERTION_AUDIENCE: ${BACKUP_OPERATOR_SERVICE_ASSERTION_AUDIENCE:-backup-operator}
      BACKUP_OPERATOR_CONTROL_STORE_DRIVER: postgres
      BACKUP_OPERATOR_CONTROL_STORE_DSN: postgres://backup_operator:${BACKUP_OPERATOR_POSTGRES_PASSWORD}@platform-db:5432/backup_operator?sslmode=disable
      BACKUP_OPERATOR_CONTROL_STORE_SYSTEM_IDENTIFIER: ${BACKUP_OPERATOR_CONTROL_STORE_SYSTEM_IDENTIFIER:-control-plane-postgres}
      BACKUP_OPERATOR_CONTROL_STORE_DATA_DOMAIN: ${BACKUP_OPERATOR_CONTROL_STORE_DATA_DOMAIN:-platform-db-data}
      BACKUP_OPERATOR_RUNTIME_ENABLED: "true"
      BACKUP_OPERATOR_RUNTIME_MAX_CONCURRENT_OPERATIONS: ${BACKUP_OPERATOR_RUNTIME_MAX_CONCURRENT_OPERATIONS:-4}
    ports:
      - 127.0.0.1:${BACKUP_OPERATOR_HTTP_PORT:-8080}:8080
    security_opt: [no-new-privileges:true]
    networks: [control]

  backup-operator-tls:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    restart: unless-stopped
    read_only: true
    depends_on:
      backup-operator:
        condition: service_started
    volumes:
      - ./volumes/management/backup-operator-nginx.conf:/etc/nginx/nginx.conf:ro
    secrets:
      - source: fleet_enrollment_server_cert
        target: fleet-management/server.crt
      - source: fleet_enrollment_server_key
        target: fleet-management/server.key
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt: [no-new-privileges:true]
    networks:
      control: {}
      management:
        aliases: [backup-operator-tls]

  platform-auth:
    image: supabase/gotrue:v2.189.0
    restart: unless-stopped
    depends_on:
      platform-migrate:
        condition: service_completed_successfully
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${FLEET_PUBLIC_URL:?set FLEET_PUBLIC_URL}/platform-auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://postgres:${PLATFORM_POSTGRES_PASSWORD}@platform-db:5432/platform
      GOTRUE_SITE_URL: ${FLEET_PUBLIC_URL}
      GOTRUE_URI_ALLOW_LIST: ${FLEET_PUBLIC_URL}/**
      GOTRUE_DISABLE_SIGNUP: "true"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_SECRET: ${PLATFORM_JWT_SECRET:?set PLATFORM_JWT_SECRET}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_SMTP_HOST: ${PLATFORM_SMTP_HOST:-}
      GOTRUE_SMTP_PORT: ${PLATFORM_SMTP_PORT:-587}
      GOTRUE_SMTP_USER: ${PLATFORM_SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${PLATFORM_SMTP_PASS:-}
      GOTRUE_SMTP_ADMIN_EMAIL: ${PLATFORM_SMTP_ADMIN_EMAIL:-admin@internal.test}
      GOTRUE_SMTP_SENDER_NAME: ${PLATFORM_SMTP_SENDER_NAME:-Supabase Platform}
      GOTRUE_MAILER_URLPATHS_INVITE: /verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /verify
    healthcheck:
      test: [CMD, wget, --no-verbose, --tries=1, --spider, http://localhost:9999/health]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [control]

  studio:
    image: ${FLEET_STUDIO_IMAGE:?set FLEET_STUDIO_IMAGE}
    restart: unless-stopped
    depends_on:
      platform-migrate:
        condition: service_completed_successfully
      platform-auth:
        condition: service_healthy
    environment:
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_STUDIO_DEPLOYMENT_PROFILE: fleet
      NEXT_PUBLIC_SELF_PLATFORM: "true"
      SELF_PLATFORM_METRICS_CONCURRENCY: ${SELF_PLATFORM_METRICS_CONCURRENCY:-8}
      # Server-only discovery snapshot. The browser never supplies lifecycle
      # component versions; the Agent rejects a plan if its local snapshot differs.
      FLEET_LIFECYCLE_COMPONENT_VERSIONS: ${FLEET_LIFECYCLE_COMPONENT_VERSIONS:-}
      PLATFORM_POSTGRES_HOST: platform-db
      PLATFORM_POSTGRES_PORT: 5432
      PLATFORM_POSTGRES_DB: platform
      PLATFORM_POSTGRES_USER: postgres
      PLATFORM_POSTGRES_PASSWORD: ${PLATFORM_POSTGRES_PASSWORD}
      PLATFORM_GOTRUE_URL: http://platform-auth:9999
      PLATFORM_JWT_SECRET: ${PLATFORM_JWT_SECRET}
      PLATFORM_ENCRYPTION_KEY: ${PLATFORM_ENCRYPTION_KEY:?set PLATFORM_ENCRYPTION_KEY}
      PLATFORM_SITE_URL: ${FLEET_PUBLIC_URL}
      NEXT_PUBLIC_API_URL: ${FLEET_PUBLIC_URL}/api
      NEXT_PUBLIC_GOTRUE_URL: ${FLEET_PUBLIC_URL}/platform-auth/v1
      # Fleet routes use each registered project's `${kong_url}/pg` endpoint.
      # This key must match the pg-meta CRYPTO_KEY on every managed target.
      PG_META_CRYPTO_KEY: ${PG_META_CRYPTO_KEY}
      SUPABASE_PUBLIC_URL: ${FLEET_PUBLIC_URL}
      SUPABASE_URL: ${MANAGED_SUPABASE_URL:-http://kong:8000}
      SUPABASE_ANON_KEY: ${MANAGED_ANON_KEY:-unused-fleet-anon}
      SUPABASE_SERVICE_KEY: ${MANAGED_SERVICE_ROLE_KEY:-unused-fleet-service}
      AUTH_JWT_SECRET: ${MANAGED_JWT_SECRET:-unused-fleet-default}
      FLEET_MANAGEMENT_ASSERTION_PRIMARY: ${FLEET_CONTROL_SERVICE_ASSERTION_KEY:?set FLEET_CONTROL_SERVICE_ASSERTION_KEY}
      BACKUP_OPERATOR_URL: https://backup-operator-tls:8443
      BACKUP_OPERATOR_SERVICE_ASSERTION_KEY: ${FLEET_CONTROL_SERVICE_ASSERTION_KEY:?set FLEET_CONTROL_SERVICE_ASSERTION_KEY}
      BACKUP_OPERATOR_SERVICE_ASSERTION_ISSUER: ${BACKUP_OPERATOR_SERVICE_ASSERTION_ISSUER:-studio-platform}
      BACKUP_OPERATOR_SERVICE_ASSERTION_AUDIENCE: ${BACKUP_OPERATOR_SERVICE_ASSERTION_AUDIENCE:-backup-operator}
      SNIPPETS_MANAGEMENT_FOLDER: /app/snippets
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://localhost:3000/api/get-utc-time').then(r=>{if(r.status!==200)throw Error(r.status)})"
      interval: 5s
      timeout: 10s
      retries: 10
    volumes:
      - control-snippets:/app/snippets
    secrets:
      - source: fleet_agent_ca_cert
        target: fleet-management/ca.crt
    networks: [control, management]

  gateway:
    image: kong/kong:3.9.1
    restart: unless-stopped
    depends_on:
      studio:
        condition: service_healthy
    ports:
      - ${FLEET_HTTP_PORT:-8001}:8000
    volumes:
      - ./volumes/api/kong-plt.yml:/home/kong/temp.yml:ro
      - ../volumes/api/kong-entrypoint.sh:/home/kong/kong-entrypoint.sh:ro
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/kong.yml
      KONG_DISABLE_META_ROUTE: "true"
      KONG_ROUTER_FLAVOR: expressions
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth,request-termination,ip-restriction,post-function
      SUPABASE_ANON_KEY: ${MANAGED_ANON_KEY:-unused-fleet-anon}
      SUPABASE_SERVICE_KEY: ${MANAGED_SERVICE_ROLE_KEY:-unused-fleet-service}
      SUPABASE_PUBLISHABLE_KEY: ""
      SUPABASE_SECRET_KEY: ""
      ANON_KEY_ASYMMETRIC: ""
      SERVICE_ROLE_KEY_ASYMMETRIC: ""
    entrypoint: [/bin/sh, /home/kong/kong-entrypoint.sh]
    networks:
      control:
        aliases: [kong]

networks:
  control: {}
  management:
    name: ${FLEET_MANAGEMENT_NETWORK_NAME:-fleet-management}
    external: true

volumes:
  platform-db-data:
  fleet-artifacts:
  control-snippets:

secrets:
  fleet_agent_ca_cert:
    file: ./secrets/fleet-management/ca.crt
  fleet_agent_ca_key:
    file: ./secrets/fleet-management/ca.key
  fleet_enrollment_server_cert:
    file: ./secrets/fleet-management/server.crt
  fleet_enrollment_server_key:
    file: ./secrets/fleet-management/server.key
