# Example RBAC for a Fleet Agent that delivers sealed secrets in this
# namespace. Not applied by deploy.sh: apply it with the Agent's own
# deployment, and keep resourceNames in step with the Agent's
# --kubernetes-secret-services (here: functions).
#
# Secrets: the Agent may only read and server-side apply the Fleet-owned
# Secret of each allowlisted service. Deployments: it may read them and patch
# the pod template annotation that restarts them.
apiVersion: v1
kind: ServiceAccount
metadata: { name: fleet-agent, namespace: supabase }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: fleet-agent-secrets, namespace: supabase }
rules:
  # `create` cannot be limited by resourceNames; server-side apply creates the
  # Secret on the first apply.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [supabase-fleet-functions-secrets]
    verbs: [get, patch]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [functions]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: fleet-agent-secrets, namespace: supabase }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: fleet-agent-secrets }
subjects:
  - { kind: ServiceAccount, name: fleet-agent, namespace: supabase }
