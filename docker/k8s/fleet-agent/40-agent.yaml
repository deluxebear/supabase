# The Fleet Agent for this namespace. It connects out to Fleet Control over
# mTLS gRPC; nothing connects in, so there is no Service.
#
# Enabled:
# - runtime.config.reconcile with sealed secrets for the Deployments in
#   FLEET_AGENT_KUBERNETES_SECRET_SERVICES. The recipient key lives on the
#   state volume and never leaves the pod.
# - functions.deploy onto the shared fleet-functions volume, probed through
#   Kong with the service role key.
apiVersion: apps/v1
kind: Deployment
metadata: { name: fleet-agent, namespace: supabase, labels: { app: fleet-agent } }
spec:
  replicas: 1
  # One Agent per binding: the journal lock and the ReadWriteOnce volume both
  # require the old pod to stop before the new one starts.
  strategy: { type: Recreate }
  selector: { matchLabels: { app: fleet-agent } }
  template:
    metadata: { labels: { app: fleet-agent } }
    spec:
      serviceAccountName: fleet-agent
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: fleet-agent
          image: FLEET_AGENT_IMAGE
          command: [/usr/local/bin/fleet-agent]
          envFrom:
            - configMapRef: { name: fleet-agent-identity }
          env:
            - { name: FLEET_AGENT_ADAPTER, value: kubernetes }
            - { name: FLEET_AGENT_CLIENT_CERT, value: /var/lib/fleet-agent/trust/agent-cert.pem }
            - { name: FLEET_AGENT_CLIENT_KEY, value: /var/lib/fleet-agent/trust/agent-key.pem }
            - { name: FLEET_AGENT_SERVER_CA, value: /var/lib/fleet-agent/trust/agent-ca.pem }
            - { name: FLEET_AGENT_JOURNAL, value: /var/lib/fleet-agent/agent-journal.db }
            - { name: FLEET_AGENT_LOCK, value: /var/lib/fleet-agent/agent.lock }
            - { name: FLEET_AGENT_ADVERTISE_CONFIG_RECONCILE, value: "true" }
            - { name: FLEET_AGENT_KUBERNETES_NAMESPACE, valueFrom: { fieldRef: { fieldPath: metadata.namespace } } }
            - { name: FLEET_AGENT_KUBERNETES_EDGE_RUNTIME_DEPLOYMENT, value: functions }
            - { name: FLEET_AGENT_FUNCTION_ARTIFACT_ROOT, value: /var/lib/supabase-fleet/functions }
            - { name: FLEET_AGENT_FUNCTION_PROBE_URL, value: "http://kong:8000/functions/v1" }
            - { name: FLEET_AGENT_FUNCTION_PROBE_TOKEN, valueFrom: { secretKeyRef: { name: supabase-env, key: SERVICE_ROLE_KEY } } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - { name: state, mountPath: /var/lib/fleet-agent }
            - { name: functions, mountPath: /var/lib/supabase-fleet/functions }
      volumes:
        - { name: state, persistentVolumeClaim: { claimName: fleet-agent-state } }
        - { name: functions, persistentVolumeClaim: { claimName: fleet-functions } }
