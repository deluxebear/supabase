# Least-privilege identity for the Fleet Agent in the `supabase` namespace.
#
# Secrets: the Agent reads and server-side applies only the Fleet-owned Secret
# of each service in FLEET_AGENT_KUBERNETES_SECRET_SERVICES. Kubernetes cannot
# limit `create` by name, and server-side apply creates the Secret on the first
# apply, so `create` is namespace-wide; the Agent itself only ever writes
# supabase-fleet-<service>-secrets.
# Deployments: the Agent reads them and patches the pod template annotation
# that restarts them.
#
# Runtime inventory: the Agent lists pods, PersistentVolumeClaims, and
# ResourceQuotas in the namespace (read-only), and reads the node that runs
# the database when no ResourceQuota sets the namespace's compute.
#
# Keep resourceNames in step with FLEET_AGENT_KUBERNETES_SECRET_SERVICES.
apiVersion: v1
kind: ServiceAccount
metadata: { name: fleet-agent, namespace: supabase, labels: { app: fleet-agent } }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: fleet-agent, namespace: supabase, labels: { app: fleet-agent } }
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [supabase-fleet-functions-secrets, supabase-fleet-auth-secrets]
    verbs: [get, patch]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [functions, auth]
    verbs: [get, patch]
  - apiGroups: [""]
    resources: [pods, persistentvolumeclaims, resourcequotas]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: fleet-agent, namespace: supabase, labels: { app: fleet-agent } }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: fleet-agent }
subjects:
  - { kind: ServiceAccount, name: fleet-agent, namespace: supabase }
---
# Nodes are cluster-scoped. Read-only, and only used for the database node's
# allocatable CPU and memory.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: fleet-agent-nodes, labels: { app: fleet-agent } }
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: fleet-agent-nodes, labels: { app: fleet-agent } }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: fleet-agent-nodes }
subjects:
  - { kind: ServiceAccount, name: fleet-agent, namespace: supabase }
