services:
  backup-operator:
    image: ghcr.io/supabase/backup-operator:${BACKUP_OPERATOR_VERSION:?set BACKUP_OPERATOR_VERSION}
    command: ["--mode=operator", "--listen=0.0.0.0:8080"]
    read_only: true
    user: "65532:65532"
    environment:
      BACKUP_OPERATOR_SERVICE_ASSERTION_KEY: ${BACKUP_OPERATOR_SERVICE_ASSERTION_KEY:?set BACKUP_OPERATOR_SERVICE_ASSERTION_KEY}
      BACKUP_OPERATOR_CONTROL_STORE_DRIVER: ${BACKUP_OPERATOR_CONTROL_STORE_DRIVER:-sqlite}
      BACKUP_OPERATOR_CONTROL_STORE_DSN: ${BACKUP_OPERATOR_CONTROL_STORE_DSN:-/var/lib/backup-operator/control.db}
      BACKUP_OPERATOR_RUNTIME_ENABLED: ${BACKUP_OPERATOR_RUNTIME_ENABLED:-true}
    ports:
      - "127.0.0.1:${BACKUP_OPERATOR_HTTP_PORT:-8080}:8080"
    volumes:
      - operator-state:/var/lib/backup-operator
      - ./secrets:/run/secrets:ro
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
volumes:
  operator-state:
