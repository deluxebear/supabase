apiVersion: apps/v1
kind: Deployment
metadata:
  name: backup-operator
spec:
  replicas: 1
  selector:
    matchLabels: { app: backup-operator }
  template:
    metadata:
      labels: { app: backup-operator }
    spec:
      serviceAccountName: backup-operator
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: operator
          image: ghcr.io/supabase/backup-operator
          args: ['--mode=operator', '--listen=0.0.0.0:8080']
          env:
            - name: BACKUP_OPERATOR_SERVICE_ASSERTION_KEY
              valueFrom:
                secretKeyRef:
                  name: backup-operator-secrets
                  key: service-assertion-key
            - name: BACKUP_OPERATOR_CONTROL_STORE_DRIVER
              value: postgres
            - name: BACKUP_OPERATOR_CONTROL_STORE_DSN
              valueFrom:
                secretKeyRef:
                  name: backup-operator-secrets
                  key: control-store-dsn
            - name: BACKUP_OPERATOR_CONTROL_STORE_SYSTEM_IDENTIFIER
              value: backup-operator-control
            - name: BACKUP_OPERATOR_CONTROL_STORE_DATA_DOMAIN
              value: backup-operator-postgres
            - name: BACKUP_OPERATOR_RUNTIME_ENABLED
              value: 'true'
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /readyz, port: http }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ['ALL'] }
---
apiVersion: v1
kind: Service
metadata:
  name: backup-operator
spec:
  selector: { app: backup-operator }
  ports:
    - name: http
      port: 8080
      targetPort: http
