image:
  repository: ghcr.io/supabase/backup-operator
  tag: v0.1.1
  digest: ''
replicaCount: 1
serviceAccount:
  create: true
  name: backup-operator
service:
  port: 8080
serviceAssertion:
  existingSecret: backup-operator-secrets
  key: service-assertion-key
controlStore:
  # Production requires a PostgreSQL database in a recovery domain independent
  # from every managed PostgreSQL cluster. The Secret value is a complete DSN.
  existingSecret: backup-operator-secrets
  dsnKey: control-store-dsn
  systemIdentifier: backup-operator-control
  dataDomain: backup-operator-postgres
