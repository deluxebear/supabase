services:
  fleet-control-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fleet_control
      POSTGRES_USER: fleet_control
      POSTGRES_PASSWORD: ${FLEET_CONTROL_POSTGRES_PASSWORD:?set FLEET_CONTROL_POSTGRES_PASSWORD}
    healthcheck:
      test: [CMD-SHELL, pg_isready -U fleet_control -d fleet_control]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - fleet-control-db:/var/lib/postgresql/data
    restart: unless-stopped

  fleet-control:
    image: ghcr.io/supabase/fleet-control:${FLEET_CONTROL_VERSION:?set FLEET_CONTROL_VERSION}
    command: [--listen=0.0.0.0:8090]
    read_only: true
    user: "65532:65532"
    environment:
      FLEET_CONTROL_SERVICE_ASSERTION_KEY: ${FLEET_CONTROL_SERVICE_ASSERTION_KEY:?set FLEET_CONTROL_SERVICE_ASSERTION_KEY}
      FLEET_CONTROL_SERVICE_ASSERTION_ISSUER: ${FLEET_CONTROL_SERVICE_ASSERTION_ISSUER:-studio-platform}
      FLEET_CONTROL_SERVICE_ASSERTION_AUDIENCE: ${FLEET_CONTROL_SERVICE_ASSERTION_AUDIENCE:-fleet-control}
      FLEET_CONTROL_STORE_DRIVER: postgres
      FLEET_CONTROL_STORE_DSN: postgres://fleet_control:${FLEET_CONTROL_POSTGRES_PASSWORD}@fleet-control-db:5432/fleet_control?sslmode=disable
      FLEET_CONTROL_STORE_SYSTEM_IDENTIFIER: ${FLEET_CONTROL_STORE_SYSTEM_IDENTIFIER:-fleet-control}
      FLEET_CONTROL_STORE_DATA_DOMAIN: ${FLEET_CONTROL_STORE_DATA_DOMAIN:-fleet-control-db}
    ports:
      - 127.0.0.1:${FLEET_CONTROL_HTTP_PORT:-8090}:8090
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    depends_on:
      fleet-control-db:
        condition: service_healthy

volumes:
  fleet-control-db:
