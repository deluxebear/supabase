syntax = "proto3";

package supabase.agent.transport.v1;

option go_package = "github.com/supabase/supabase/apps/backup-operator/gen/proto/agent/transport/v1;transportv1";

message ProtocolVersion {
  uint32 major = 1;
  uint32 minor = 2;
}

message OperationIdentity {
  string operation_id = 1;
  string task_id = 2;
  string project_ref = 3;
  string target_id = 4;
  string binding_id = 5;
  string idempotency_key = 6;
  int64 fencing_token = 7;
  int64 expected_generation = 8;
  int64 deadline_unix_milliseconds = 9;
}

message TaskProgress {
  string task_id = 1;
  uint32 percent = 2;
  string phase = 3;
}

message TaskError {
  string code = 1;
  string message = 2;
  bool retryable = 3;
}
