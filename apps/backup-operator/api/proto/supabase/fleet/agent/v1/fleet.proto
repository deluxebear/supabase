syntax = "proto3";

package supabase.fleet.agent.v1;

import "supabase/agent/transport/v1/transport.proto";

option go_package = "github.com/supabase/supabase/apps/backup-operator/gen/proto/fleet/v1;fleetagentv1";

service FleetAgentControlService {
  rpc Connect(stream ConnectRequest) returns (stream ConnectResponse);
  rpc DownloadArtifact(DownloadArtifactRequest) returns (stream ArtifactChunk);
}

message ConnectRequest {
  oneof payload {
    AgentHello hello = 1;
    supabase.agent.transport.v1.TaskProgress progress = 2;
    TaskResult result = 3;
    Heartbeat heartbeat = 4;
  }
}

message ConnectResponse {
  oneof payload {
    TypedTask task = 1;
    Acknowledgement acknowledgement = 2;
  }
}

message AgentHello {
  string agent_id = 1;
  string target_id = 2;
  string binding_id = 3;
  string node_id = 4;
  supabase.agent.transport.v1.ProtocolVersion protocol = 5;
  string build = 6;
  repeated string capabilities = 7;
}

message TypedTask {
  supabase.agent.transport.v1.OperationIdentity identity = 1;
  string domain = 2;
  string capability = 3;
  string input_schema = 4;
  map<string, string> preconditions = 5;
  oneof input {
    ObserveRuntimeInput observe_runtime = 10;
    ReconcileConfigurationInput reconcile_configuration = 11;
    DeployFunctionInput deploy_function = 12;
    ExecuteLifecycleInput execute_lifecycle = 13;
  }
}

message ObserveRuntimeInput {
  repeated string services = 1;
}

message ReconcileConfigurationInput {
  bytes document_json = 1;
  string desired_digest = 2;
  int64 expected_generation = 3;
}

message DeployFunctionInput {
  bytes deployment_json = 1;
}

message ExecuteLifecycleInput {
  bytes lifecycle_json = 1;
}

message TaskResult {
  string task_id = 1;
  string evidence_schema = 2;
  oneof result {
    ObserveRuntimeEvidence observe_runtime = 10;
    supabase.agent.transport.v1.TaskError error = 11;
    ReconcileConfigurationEvidence reconcile_configuration = 12;
    FunctionDeploymentEvidence deploy_function = 13;
    LifecycleEvidence execute_lifecycle = 14;
  }
}

message ObserveRuntimeEvidence {
  repeated RuntimeService services = 1;
  int64 observed_at_unix_milliseconds = 2;
}

message ReconcileConfigurationEvidence {
  bytes evidence_json = 1;
}

message FunctionDeploymentEvidence {
  bytes evidence_json = 1;
}

message LifecycleEvidence {
  bytes evidence_json = 1;
}

message DownloadArtifactRequest {
  string agent_id = 1;
  string project_ref = 2;
  string target_id = 3;
  string binding_id = 4;
  string digest = 5;
}

message ArtifactChunk {
  bytes data = 1;
}

message RuntimeService {
  string name = 1;
  string state = 2;
  string version = 3;
}

message Heartbeat {
  int64 unix_milliseconds = 1;
}

message Acknowledgement {
  string task_id = 1;
}
