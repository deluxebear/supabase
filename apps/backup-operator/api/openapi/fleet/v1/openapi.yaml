openapi: 3.1.0
info:
  title: Supabase Fleet Control API
  version: 1.0.0
  description: General stack management control domain. Backup and restore APIs are intentionally excluded.
security:
  - serviceAssertion: []
paths:
  /healthz:
    security: []
    get:
      operationId: fleetHealth
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /readyz:
    security: []
    get:
      operationId: fleetReady
      responses:
        '200':
          description: Fleet store schema is ready
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503': { $ref: '#/components/responses/Error' }
  /platform/fleet/v1/projects/{projectRef}/capabilities:
    get:
      operationId: listFleetCapabilities
      parameters: [{ $ref: '#/components/parameters/ProjectRef' }]
      responses:
        '200':
          description: Project-authorized Fleet Control provider capabilities
          content:
            application/json:
              schema:
                type: object
                required: [capabilities]
                properties:
                  capabilities:
                    type: array
                    items: { $ref: '#/components/schemas/Capability' }
        '403': { $ref: '#/components/responses/Error' }
  /platform/fleet/v1/projects/{projectRef}/function-artifacts/{digest}:
    put:
      operationId: putFunctionArtifact
      parameters:
        - { $ref: '#/components/parameters/ProjectRef' }
        - { $ref: '#/components/parameters/ArtifactDigest' }
        - name: X-Function-Slug
          in: header
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,62}$' }
        - name: X-Function-Entrypoint
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 512 }
      requestBody:
        required: true
        content:
          application/vnd.supabase.function-bundle+json:
            schema: { type: string, format: binary, maxLength: 20971520 }
      responses:
        '200':
          description: Existing byte-identical project artifact
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FunctionArtifact' }
        '201':
          description: Immutable project artifact stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FunctionArtifact' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
    get:
      operationId: getFunctionArtifact
      parameters:
        - { $ref: '#/components/parameters/ProjectRef' }
        - { $ref: '#/components/parameters/ArtifactDigest' }
      responses:
        '200':
          description: Project-authorized immutable function bundle
          content:
            application/vnd.supabase.function-bundle+json:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /platform/fleet/v1/projects/{projectRef}/operations:
    post:
      operationId: createFleetOperation
      parameters:
        - { $ref: '#/components/parameters/ProjectRef' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOperation' }
      responses:
        '201':
          description: Durable Fleet operation accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operation' }
        '200':
          description: Existing idempotent Fleet operation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operation' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /platform/fleet/v1/projects/{projectRef}/operations/{operationId}:
    get:
      operationId: getFleetOperation
      parameters:
        - { $ref: '#/components/parameters/ProjectRef' }
        - { $ref: '#/components/parameters/OperationId' }
      responses:
        '200':
          description: Project-scoped durable operation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operation' }
        '404': { $ref: '#/components/responses/Error' }
  /platform/fleet/v1/projects/{projectRef}/operations/{operationId}/events:
    get:
      operationId: replayFleetOperationEvents
      parameters:
        - { $ref: '#/components/parameters/ProjectRef' }
        - { $ref: '#/components/parameters/OperationId' }
        - { name: cursor, in: query, schema: { type: integer, format: int64, minimum: 0 } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 1000, default: 100 },
          }
      responses:
        '200':
          description: Bounded resumable event page
          content:
            text/event-stream:
              schema: { type: string }
        '404': { $ref: '#/components/responses/Error' }
  /platform/fleet/v1/projects/{projectRef}/management-bindings/{bindingId}/enrollment-tokens:
    post:
      operationId: createAgentEnrollmentToken
      parameters:
        - { $ref: '#/components/parameters/ProjectRef' }
        - { $ref: '#/components/parameters/BindingId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateEnrollmentToken' }
      responses:
        '201':
          description: Single-use enrollment token; plaintext is returned only once
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnrollmentToken' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /platform/fleet/v1/projects/{projectRef}/management-bindings/{bindingId}:
    get:
      operationId: getManagementBinding
      parameters:
        - { $ref: '#/components/parameters/ProjectRef' }
        - { $ref: '#/components/parameters/BindingId' }
      responses:
        '200':
          description: Non-secret Agent and capability projection for one project binding
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagementBindingStatus' }
        '404': { $ref: '#/components/responses/Error' }
  /platform/fleet/v1/projects/{projectRef}/management-bindings/{bindingId}/revoke:
    post:
      operationId: revokeManagementBinding
      parameters:
        - { $ref: '#/components/parameters/ProjectRef' }
        - { $ref: '#/components/parameters/BindingId' }
      responses:
        '200':
          description: Binding, certificates, and outstanding enrollment tokens are centrally revoked
          content:
            application/json:
              schema:
                type: object
                required: [bindingId, state]
                properties:
                  bindingId: { type: string }
                  state: { type: string, const: revoked }
        '404': { $ref: '#/components/responses/Error' }
  /platform/fleet/v1/projects/{projectRef}/management-bindings/{bindingId}/agents/{agentId}/revoke:
    post:
      operationId: revokeAgent
      parameters:
        - { $ref: '#/components/parameters/ProjectRef' }
        - { $ref: '#/components/parameters/BindingId' }
        - { $ref: '#/components/parameters/AgentId' }
      responses:
        '200':
          description: Agent certificates and outstanding enrollment tokens are centrally revoked
          content:
            application/json:
              schema:
                type: object
                required: [agentId, state]
                properties:
                  agentId: { type: string }
                  state: { type: string, const: revoked }
        '404': { $ref: '#/components/responses/Error' }
  /platform/fleet/v1/enrollments:
    security: []
    post:
      operationId: enrollAgent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnrollAgent' }
      responses:
        '201':
          description: Short-lived client certificate issued from a validated CSR
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssuedAgentCertificate' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /platform/fleet/v1/agents/{agentId}/certificate-requests:
    security:
      - agentMutualTLS: []
    post:
      operationId: rotateAgentCertificate
      parameters: [{ $ref: '#/components/parameters/AgentId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [csrPem]
              properties:
                csrPem: { type: string, minLength: 1, maxLength: 32768 }
      responses:
        '201':
          description: New certificate revision with a bounded old-certificate overlap window
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssuedAgentCertificate' }
        '401': { $ref: '#/components/responses/Error' }
  /platform/fleet/v1/agents/{agentId}/heartbeat:
    security:
      - agentMutualTLS: []
    post:
      operationId: recordAgentHeartbeat
      parameters: [{ $ref: '#/components/parameters/AgentId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentHeartbeat' }
      responses:
        '200':
          description: Versioned Agent and per-domain capability observation persisted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagementBindingStatus' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    serviceAssertion:
      type: http
      scheme: bearer
      bearerFormat: JWT
    agentMutualTLS:
      type: mutualTLS
  parameters:
    ProjectRef:
      {
        name: projectRef,
        in: path,
        required: true,
        schema: { type: string, minLength: 1, maxLength: 128 },
      }
    OperationId:
      {
        name: operationId,
        in: path,
        required: true,
        schema: { type: string, minLength: 1, maxLength: 128 },
      }
    IdempotencyKey:
      {
        name: Idempotency-Key,
        in: header,
        required: true,
        schema: { type: string, minLength: 1, maxLength: 255 },
      }
    BindingId:
      {
        name: bindingId,
        in: path,
        required: true,
        schema: { type: string, minLength: 1, maxLength: 128 },
      }
    AgentId:
      {
        name: agentId,
        in: path,
        required: true,
        schema: { type: string, minLength: 1, maxLength: 128 },
      }
    ArtifactDigest:
      {
        name: digest,
        in: path,
        required: true,
        schema: { type: string, pattern: '^[0-9a-f]{64}$' },
      }
  responses:
    Error:
      description: Stable Fleet error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Health:
      type: object
      required: [status, service, apiVersion, schemaVersion]
      properties:
        status: { type: string, enum: [ok] }
        service: { type: string, const: fleet-control }
        apiVersion: { type: string, const: v1 }
        schemaVersion: { type: integer, minimum: 1 }
    Blocker:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        remediation: { type: string }
    Capability:
      type: object
      required: [name, state, mode, source, contractVersion, blockers]
      properties:
        name: { type: string }
        state: { type: string, enum: [available, unavailable, unauthorized, stale, unsupported] }
        mode: { type: string, enum: [operator, agent, kubernetes-job, unsupported] }
        source: { type: string, const: fleet-control }
        contractVersion: { type: string }
        blockers:
          type: array
          items: { $ref: '#/components/schemas/Blocker' }
    CapabilityObservation:
      type: object
      additionalProperties: false
      required: [domain, name, contractVersion, inputSchema, evidenceSchema]
      properties:
        domain: { type: string, pattern: '^[a-z][a-z0-9-]*(\\.[a-z][a-z0-9-]*)+$' }
        name: { type: string, pattern: '^[a-z][a-z0-9-]*(\\.[a-z][a-z0-9-]*)+$' }
        contractVersion: { type: string, minLength: 1, maxLength: 32 }
        inputSchema: { type: string, pattern: '^supabase\\.' }
        evidenceSchema: { type: string, pattern: '^supabase\\.' }
        observedAt: { type: string, format: date-time }
    CreateEnrollmentToken:
      type: object
      additionalProperties: false
      required:
        [organizationId, targetId, executionTarget, deploymentKind, allowedCapabilityPrefixes]
      properties:
        organizationId: { type: string, minLength: 1, maxLength: 128 }
        targetId: { type: string, minLength: 1, maxLength: 128 }
        executionTarget: { type: string, minLength: 1, maxLength: 255 }
        deploymentKind: { type: string, enum: [compose, kubernetes, systemd, bare-metal] }
        allowedCapabilityPrefixes:
          type: array
          minItems: 1
          maxItems: 32
          uniqueItems: true
          items: { type: string, pattern: '^[a-z][a-z0-9-]*(\\.[a-z][a-z0-9-]*)*\\.$' }
    EnrollmentToken:
      type: object
      required: [id, bindingId, token, expiresAt]
      properties:
        id: { type: string }
        bindingId: { type: string }
        token: { type: string, writeOnly: true }
        expiresAt: { type: string, format: date-time }
    EnrollAgent:
      type: object
      additionalProperties: false
      required:
        [
          token,
          organizationId,
          projectRef,
          targetId,
          bindingId,
          executionTarget,
          deploymentKind,
          agentId,
          csrPem,
          protocolMajor,
          protocolMinor,
          build,
          observedIdentity,
          capabilities,
        ]
      properties:
        token: { type: string, writeOnly: true, minLength: 32, maxLength: 256 }
        organizationId: { type: string, minLength: 1, maxLength: 128 }
        projectRef: { type: string, minLength: 1, maxLength: 128 }
        targetId: { type: string, minLength: 1, maxLength: 128 }
        bindingId: { type: string, minLength: 1, maxLength: 128 }
        executionTarget: { type: string, minLength: 1, maxLength: 255 }
        deploymentKind: { type: string, enum: [compose, kubernetes, systemd, bare-metal] }
        agentId: { type: string, minLength: 1, maxLength: 128 }
        csrPem: { type: string, minLength: 1, maxLength: 32768 }
        protocolMajor: { type: integer, minimum: 1 }
        protocolMinor: { type: integer, minimum: 0 }
        build: { type: string, minLength: 1, maxLength: 128 }
        observedIdentity: { type: object }
        capabilities:
          type: array
          minItems: 1
          maxItems: 256
          items: { $ref: '#/components/schemas/CapabilityObservation' }
    Agent:
      type: object
      required:
        [
          id,
          bindingId,
          state,
          protocolMajor,
          protocolMinor,
          build,
          activeCertificateRevision,
          certificateExpiresAt,
          lastSeenAt,
          capabilities,
        ]
      properties:
        id: { type: string }
        bindingId: { type: string }
        state: { type: string, enum: [online, offline, revoked, replaced, incompatible] }
        protocolMajor: { type: integer }
        protocolMinor: { type: integer }
        build: { type: string }
        activeCertificateRevision: { type: integer, minimum: 1 }
        certificateExpiresAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        capabilities:
          type: array
          items: { $ref: '#/components/schemas/CapabilityObservation' }
    ManagementBinding:
      type: object
      required:
        [
          bindingId,
          organizationId,
          projectRef,
          targetId,
          executionTarget,
          deploymentKind,
          allowedCapabilityPrefixes,
          state,
          createdAt,
          updatedAt,
        ]
      properties:
        bindingId: { type: string }
        organizationId: { type: string }
        projectRef: { type: string }
        targetId: { type: string }
        executionTarget: { type: string }
        deploymentKind: { type: string, enum: [compose, kubernetes, systemd, bare-metal] }
        allowedCapabilityPrefixes:
          type: array
          items: { type: string }
        state: { type: string, enum: [pending, enrolling, active, revoked, incompatible] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ProjectedCapability:
      allOf:
        - { $ref: '#/components/schemas/CapabilityObservation' }
        - type: object
          required: [state, mode, source, blockers]
          properties:
            state:
              { type: string, enum: [available, unavailable, unauthorized, stale, unsupported] }
            mode: { type: string, enum: [operator, agent, kubernetes-job, unsupported] }
            source: { type: string, const: agent }
            blockers:
              type: array
              items: { $ref: '#/components/schemas/Blocker' }
    ManagementBindingStatus:
      type: object
      required: [binding, agent, capabilities]
      properties:
        binding: { $ref: '#/components/schemas/ManagementBinding' }
        agent:
          allOf:
            - { $ref: '#/components/schemas/Agent' }
          nullable: true
        capabilities:
          type: array
          items: { $ref: '#/components/schemas/ProjectedCapability' }
    IssuedAgentCertificate:
      type: object
      required: [agent, certificatePem, caCertificatePem, certificateExpiresAt]
      properties:
        agent: { $ref: '#/components/schemas/Agent' }
        certificatePem: { type: string }
        caCertificatePem: { type: string }
        certificateExpiresAt: { type: string, format: date-time }
        certificateSerial: { type: string }
        overlapUntil: { type: string, format: date-time }
    AgentHeartbeat:
      type: object
      additionalProperties: false
      required: [protocolMajor, protocolMinor, build, capabilities]
      properties:
        protocolMajor: { type: integer, minimum: 1 }
        protocolMinor: { type: integer, minimum: 0 }
        build: { type: string, minLength: 1, maxLength: 128 }
        capabilities:
          type: array
          minItems: 1
          maxItems: 256
          items: { $ref: '#/components/schemas/CapabilityObservation' }
    CreateOperation:
      type: object
      required:
        [
          operationId,
          targetId,
          bindingId,
          domain,
          capability,
          protocolMajor,
          protocolMinor,
          expectedGeneration,
          desiredRevision,
          desiredDigest,
          snapshotCanonical,
          inputSchema,
          preconditions,
          typedInput,
        ]
      additionalProperties: false
      properties:
        operationId: { type: string, minLength: 1, maxLength: 128 }
        targetId: { type: string, minLength: 1, maxLength: 128 }
        bindingId: { type: string, minLength: 1, maxLength: 128 }
        domain: { type: string, minLength: 1, maxLength: 64 }
        capability: { type: string, minLength: 1, maxLength: 128 }
        protocolMajor: { type: integer, minimum: 1 }
        protocolMinor: { type: integer, minimum: 0 }
        expectedGeneration: { type: integer, format: int64, minimum: 1 }
        desiredRevision:
          {
            type: string,
            pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$',
          }
        desiredDigest: { type: string, pattern: '^[0-9a-f]{64}$' }
        snapshotCanonical:
          {
            type: string,
            description: Canonical immutable JSON used for digest verification and never returned,
          }
        inputSchema: { type: string, pattern: '^supabase\\.fleet\\.' }
        preconditions: { type: object }
        typedInput:
          {
            type: object,
            description: Strictly validated against inputSchema; runtime.config.reconcile uses ConfigurationDocument,
          }
    Operation:
      type: object
      required:
        [
          id,
          projectRef,
          targetId,
          bindingId,
          domain,
          capability,
          state,
          protocolMajor,
          protocolMinor,
          expectedGeneration,
          desiredRevision,
          desiredDigest,
          inputSchema,
          fencingToken,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string }
        projectRef: { type: string }
        targetId: { type: string }
        bindingId: { type: string }
        domain: { type: string }
        capability: { type: string }
        state:
          {
            type: string,
            enum:
              [
                queued,
                applying,
                running,
                verifying,
                applied,
                succeeded,
                failed,
                orphaned_execution,
                manual_intervention,
              ],
          }
        protocolMajor: { type: integer }
        protocolMinor: { type: integer }
        expectedGeneration: { type: integer, format: int64 }
        desiredRevision:
          {
            type: string,
            pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$',
          }
        desiredDigest: { type: string, pattern: '^[0-9a-f]{64}$' }
        inputSchema: { type: string }
        fencingToken: { type: integer, format: int64, minimum: 1 }
        taskId: { type: string }
        agentId: { type: string }
        evidenceSchema: { type: string, pattern: '^supabase\.fleet\.' }
        evidence:
          {
            type: object,
            description: Redacted typed Agent evidence; desired input is never returned,
          }
        errorCode: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    FunctionArtifact:
      type: object
      required: [digest, size, created]
      properties:
        digest: { type: string, pattern: '^[0-9a-f]{64}$' }
        size: { type: integer, format: int64, minimum: 1, maximum: 20971520 }
        created: { type: boolean }
    FunctionDeploymentDocument:
      type: object
      additionalProperties: false
      required: [action, slug, adapter, staticPatterns, verifyJwt]
      properties:
        action: { type: string, enum: [deploy, delete] }
        slug: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,62}$' }
        adapter: { type: string, enum: [compose, kubernetes] }
        artifactDigest: { type: string, pattern: '^[0-9a-f]{64}$' }
        artifactSize: { type: integer, format: int64, minimum: 1, maximum: 20971520 }
        entrypointPath: { type: string, minLength: 1, maxLength: 512 }
        importMapPath: { type: string, minLength: 1, maxLength: 512 }
        staticPatterns:
          type: array
          maxItems: 64
          items: { type: string, minLength: 1, maxLength: 512 }
        verifyJwt: { type: boolean }
    FunctionDeploymentEvidence:
      type: object
      required: [schema, status, adapter, slug, observedGeneration, probe, activatedAt]
      properties:
        schema: { type: string, const: supabase.fleet.functions.deploy.evidence.v1 }
        status: { type: string, enum: [active, deleted, rolled-back, manual-intervention] }
        adapter: { type: string, enum: [compose, kubernetes] }
        slug: { type: string }
        artifactDigest: { type: string }
        previousDigest: { type: string }
        observedGeneration: { type: integer, format: int64, minimum: 1 }
        probe:
          type: object
          required: [succeeded]
          properties:
            succeeded: { type: boolean }
            message: { type: string }
        activatedAt: { type: string, format: date-time }
        remediation: { type: string }
    ConfigurationDocument:
      type: object
      additionalProperties: false
      required: [ownershipMode, adapter]
      properties:
        ownershipMode: { type: string, enum: [observe-only, direct-managed, gitops-managed] }
        adapter: { type: string, enum: [compose, kubernetes] }
        compose:
          type: object
          additionalProperties: false
          required: [files]
          properties:
            files:
              type: array
              minItems: 1
              maxItems: 128
              items:
                type: object
                additionalProperties: false
                required: [path, content]
                properties:
                  path: { type: string, pattern: '^(?!/)(?!.*(?:^|/)\.\.(?:/|$)).+$' }
                  content: { type: string, writeOnly: true }
                  mode: { type: integer, enum: [384, 416, 420] }
        kubernetes:
          type: object
          additionalProperties: false
          required: [resources]
          properties:
            resources:
              type: array
              minItems: 1
              maxItems: 64
              items:
                type: object
                additionalProperties: false
                required: [version, resource, kind, namespace, name, ownedFields, desiredObject]
                properties:
                  group: { type: string }
                  version: { type: string }
                  resource: { type: string }
                  kind: { type: string }
                  namespace: { type: string }
                  name: { type: string }
                  ownedFields:
                    type: array
                    minItems: 1
                    maxItems: 128
                    uniqueItems: true
                    items: { type: string, pattern: '^/' }
                  desiredObject: { type: object, writeOnly: true }
    ReconciliationEvidence:
      type: object
      required:
        [
          schema,
          ownershipMode,
          adapter,
          driftState,
          applied,
          observedGeneration,
          observedDocument,
          observedDigest,
          conflicts,
        ]
      properties:
        schema: { type: string, const: supabase.fleet.runtime.config.evidence.v1 }
        ownershipMode: { type: string, enum: [observe-only, direct-managed, gitops-managed] }
        adapter: { type: string, enum: [compose, kubernetes] }
        driftState: { type: string, enum: [in-sync, drifted, ownership-conflict] }
        applied: { type: boolean }
        observedGeneration: { type: integer, format: int64, minimum: 1 }
        observedDocument: { type: object, description: Digest-only redacted observation }
        observedDigest: { type: string, pattern: '^[0-9a-f]{64}$' }
        conflicts:
          type: array
          items:
            type: object
            required: [code, resource, message, remediation]
            properties:
              code: { type: string, const: ownership_conflict }
              resource: { type: string }
              field: { type: string }
              owner: { type: string }
              message: { type: string }
              remediation: { type: string }
    Error:
      type: object
      required: [code, message, requestId, retryable, details]
      properties:
        code: { type: string }
        message: { type: string }
        requestId: { type: string }
        retryable: { type: boolean }
        details: { type: object }
